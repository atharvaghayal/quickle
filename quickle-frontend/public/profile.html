<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickle Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-dark-bg: #000000;
            --color-green: #00ff00;
            --color-yellow: #ffff00;
            --color-gray: #555555;
            --color-text-light: #ffffff;
            --color-card-bg: #111;
        }

        body {
            background-color: var(--color-dark-bg);
            color: var(--color-text-light);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-container {
            background-color: var(--color-card-bg);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            border-radius: 10px;
            text-align: center;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--color-green);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 2em;
            margin: 0 auto 20px;
            border: 2px solid var(--color-text-light);
        }

        .profile-username {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: var(--color-yellow);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-item {
            background: #222;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid var(--color-gray);
        }

        .stat-label {
            font-size: 0.9em;
            color: #bbb;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--color-green);
        }

        .back-btn {
            background: var(--color-green);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        .error {
            color: #ff6b6b;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div id="loading">Loading profile...</div>
        <div id="profile-content" style="display: none;">
            <div class="profile-avatar" id="avatar"></div>
            <div class="profile-username" id="username"></div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Games Played</div>
                    <div class="stat-value" id="games-played"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Current Streak</div>
                    <div class="stat-value" id="current-streak"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Max Streak</div>
                    <div class="stat-value" id="max-streak"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Win Percentage</div>
                    <div class="stat-value" id="win-percentage"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Total Points</div>
                    <div class="stat-value" id="total-points"></div>
                </div>
            </div>
            <button class="back-btn" onclick="goBack()">Back to Game</button>
        </div>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        async function loadProfile() {
            try {
                // Fetch user info
                const userResponse = await fetch('http://localhost:8000/api/auth/me', {
                    credentials: 'include'
                });
                const userData = await userResponse.json();

                if (!userData.user) {
                    throw new Error('Not logged in');
                }

                const username = userData.user.username;
                const initial = username.charAt(0).toUpperCase();

                // Fetch stats
                const statsResponse = await fetch('http://localhost:8000/api/user/stats', {
                    credentials: 'include'
                });
                const statsData = await statsResponse.json();

                // Update UI
                document.getElementById('avatar').textContent = initial;
                document.getElementById('username').textContent = username;
                document.getElementById('games-played').textContent = statsData.times_played;
                document.getElementById('current-streak').textContent = statsData.streak + (statsData.currentStreakOngoing ? '*' : '');
                document.getElementById('max-streak').textContent = statsData.max_streak;
                document.getElementById('win-percentage').textContent = statsData.win_percentage + '%';
                document.getElementById('total-points').textContent = statsData.total_points;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('profile-content').style.display = 'block';

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Failed to load profile. Please try again.';
                document.getElementById('error').style.display = 'block';
                console.error('Profile load error:', error);
            }
        }

        function goBack() {
            window.location.href = '/';
        }

        // Load profile on page load
        loadProfile();
    </script>
</body>
</html>
